    <text x="800" y="720" font-size="72" fill="#12BEF2" fill-opacity=".55">B</text>
    <text x="195" y="870" font-size="34" fill="#3A4558">T</text>
    <text x="815" y="165" font-size="34" fill="#3A4558">CT</text>
  </g>
  <g fill="#12BEF2">
