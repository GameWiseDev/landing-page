    <path d="M490 650h60v210h-60z"/>
    <path d="M580 480h260v60H580z"/>
    <path d="M410 150h290v60H410z"/>
    <path d="M800 230h60v380h-60z"/>
    <path d="M230 470h200v60H230z"/>
